openapi: 3.1.0
info:
  title: Blindsight Runtime Security API
  version: "1.0.0"
  summary: "LLM firewall: prompt-injection, PII, and agent tool-call protection."
  description: |
    Drop-in firewall for LLM traffic. Three integration modes:

      * **Scan API**, explicit `/scan/input` and `/scan/output` calls.
      * **Reverse proxy**, wire-compatible with the OpenAI, Anthropic, Gemini,
        Vertex and Bedrock APIs; swap the SDK's `base_url` to enable scanning
        at the network boundary.
      * **Tool-call scan**, a check of agent tool arguments before execution.

    **Authentication.** Send a Blindsight API key in the `X-API-Key` header.
    Each key carries permissions, and an endpoint needs one of them:

    | Permission | Value | Endpoints |
    | --- | --- | --- |
    | Scan prompts and responses | `runtime:scan` | `/scan/*` and `/proxy/*` |
    | Read threat events | `runtime:events:read` | `/events`, `/events/{uuid}/explain`, `/analytics`, `/drift`, `/health`, `/service-status` and the other read endpoints |
    | Read firewall configuration | `runtime:config:read` | `GET /config` |
    | Write firewall configuration | `runtime:config:write` | `PUT /config` |

    `runtime:*` (Full Runtime Access) and full platform access cover all of
    them. A key acts as the person who created it and can never do more than
    that person can.

    All timestamps are UTC, ISO 8601, ending in `Z`, unless an endpoint says
    otherwise.

    See the Runtime Security guides for prose docs, SDK examples, and a
    walk-through of verdicts and configuration.
  contact:
    name: Blindsight Support
    url: https://blindsight.example.com/support
  license:
    name: Proprietary
servers:
  - url: https://platform.blindsight.io
    description: Production

tags:
  - name: Scan
    description: Single-call scan endpoints for input, output, batch, and tool calls.
  - name: Proxy
    description: Wire-compatible reverse-proxy endpoints for OpenAI, Anthropic, Gemini, Vertex and Bedrock.
  - name: Configuration
    description: Workspace-scoped firewall settings.
  - name: Analytics
    description: Read-only analytics, event log, and drift endpoints.
  - name: Health
    description: Firewall readiness and service status.

security:
  - ApiKeyAuth: []

paths:
  /api/runtime-security/scan/input:
    post:
      tags: [Scan]
      summary: Scan a user prompt before sending it to the LLM
      description: |
        Returns an `allow`, `flag`, `redact` or `block` verdict for the
        supplied text. On `redact`, use `redacted_text` instead of the
        original. On `block`, refuse the request.

        The HTTP status is `200` even when the verdict is `block`.

        Requires the `runtime:scan` permission. Rate limit: 200 requests per
        second per API key.
      operationId: scanInput
      parameters:
        - $ref: '#/components/parameters/AppId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScanInputRequest' }
            examples:
              basic:
                summary: Plain prompt
                value: { text: "What is the capital of France?" }
              personalData:
                summary: Prompt with personal data
                value:
                  text: "Please email the report to jane.doe@example.com"
                  session_id: "chat-8841"
      responses:
        '200':
          description: "Scan complete: verdict in body"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScanResponse' }
              example:
                uuid: "9c2f6a41-0d3e-4b8a-a1c7-5e8d2f3b6a90"
                verdict: redact
                pii: { count: 1, categories: [email] }
                redacted_text: "Please email the report to <EMAIL>"
                text_length: 47
                latency_ms: 12
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/QuotaExceeded' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotEnabled' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /api/runtime-security/scan/output:
    post:
      tags: [Scan]
      summary: Scan an LLM response before returning it to the user
      description: |
        Same response shape as `/scan/input`, applied to model output.

        Requires the `runtime:scan` permission. Rate limit: 200 requests per
        second per API key.
      operationId: scanOutput
      parameters:
        - $ref: '#/components/parameters/AppId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScanOutputRequest' }
            example:
              prompt: "Who is our contact?"
              response: "Call Jane Doe on +41 79 555 01 02."
      responses:
        '200':
          description: "Scan complete: verdict in body"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScanResponse' }
              example:
                uuid: "3a8e51d0-77c2-4f19-b6a4-2c9d1e0f8b35"
                verdict: redact
                pii: { count: 1, categories: [phone] }
                redacted_text: "Call Jane Doe on <PHONE>."
                text_length: 33
                latency_ms: 9
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/QuotaExceeded' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotEnabled' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /api/runtime-security/scan/batch:
    post:
      tags: [Scan]
      summary: Scan up to 32 items in one round-trip
      description: |
        Each item uses one request from the workspace allowance, the same as
        an individual scan. If the allowance runs out partway through, the
        call fails with `402`.

        A batch cannot be attributed to an App. A key that is limited to
        specific Apps gets `400` with the code `APP_SCOPED_KEY`.

        Requires the `runtime:scan` permission. Rate limit: 40 requests per
        second per API key.
      operationId: scanBatch
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScanBatchRequest' }
            example:
              items:
                - { text: "first prompt", direction: input }
                - { text: "model response here", direction: output }
      responses:
        '200':
          description: All items scanned, in request order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScanBatchResponse' }
              example:
                results:
                  - uuid: "b1d4e6a2-5c3f-4a7b-8d90-1e2f3a4b5c6d"
                    verdict: allow
                    pii: { count: 0, categories: [] }
                    redacted_text: "first prompt"
                    text_length: 12
                    latency_ms: 8
                  - uuid: "c7e2f1b3-6d4a-4b8c-9ea1-2f3a4b5c6d7e"
                    verdict: allow
                    pii: { count: 0, categories: [] }
                    redacted_text: "model response here"
                    text_length: 19
                    latency_ms: 8
        '400':
          description: The key is limited to specific Apps (`APP_SCOPED_KEY`)
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/QuotaExceeded' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotEnabled' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /api/runtime-security/scan/tool-call:
    post:
      tags: [Scan]
      summary: Check an agent tool call before running it
      description: |
        Evaluates the tool name and arguments against the workspace and App
        tool policy and masks personal data in the arguments. Part of the
        agentic guardrails module; a workspace without it gets `404`.

        Requires the `runtime:scan` permission. Rate limit: 200 requests per
        second per API key.
      operationId: scanToolCall
      parameters:
        - $ref: '#/components/parameters/AppId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScanToolCallRequest' }
            example:
              tool_name: send_email
              arguments: { to: "jane.doe@example.com", body: "Hello" }
      responses:
        '200':
          description: Verdict and reasons
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScanToolCallResponse' }
              example:
                uuid: "e4a9c2b7-1f60-4d83-8a35-6b7c0d2e9f18"
                verdict: redact
                reasons: []
                redacted_arguments: { to: "<EMAIL>", body: "Hello" }
                pii: { count: 1, categories: [email] }
                arg_bytes: 52
                latency_ms: 3
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/QuotaExceeded' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotEnabled' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /api/runtime-security/proxy/openai/v1/chat/completions:
    post:
      tags: [Proxy]
      summary: Wire-compatible OpenAI Chat Completions proxy
      description: |
        Body and response match `POST https://api.openai.com/v1/chat/completions`.
        Blindsight scans both directions. A clean request is forwarded
        unchanged, personal data is masked in place, and a block returns an
        OpenAI-shaped error.

        **Streaming**: pass `stream=true` to receive Server-Sent Events. A
        block ends the stream with a terminal chunk.

        **Headers**: `Authorization` is for OpenAI and is forwarded upstream.
        Authenticate to Blindsight with `X-API-Key` (permission `runtime:scan`).
        One exchange, a prompt and its reply, uses two requests from the
        workspace allowance.
      operationId: proxyOpenAIChat
      parameters:
        - $ref: '#/components/parameters/AppId'
      requestBody:
        required: true
        description: "OpenAI Chat Completions request body."
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
            example:
              model: gpt-4o
              messages:
                - { role: user, content: "Hello" }
      responses:
        '200':
          description: |
            With `stream=false`, an OpenAI Chat Completion. With
            `stream=true`, an SSE stream (`text/event-stream`).
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
            text/event-stream:
              schema: { type: string }
        '400':
          description: Blocked by Blindsight (prompt), or invalid body
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OpenAIError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402':
          description: The workspace allowance is used up
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OpenAIError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotEnabled' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '502':
          description: Upstream could not be reached (`upstream_error`), or the reply was blocked (`upstream_blocked`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OpenAIError' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /api/runtime-security/proxy/openai/v1/completions:
    post:
      tags: [Proxy]
      summary: Wire-compatible OpenAI legacy Completions proxy
      description: |
        Body matches `POST https://api.openai.com/v1/completions`. Streaming
        is not supported on this route: pass `stream=false` or omit it.

        Requires the `runtime:scan` permission.
      operationId: proxyOpenAICompletions
      parameters:
        - $ref: '#/components/parameters/AppId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200':
          description: OpenAI Completion response
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '400':
          description: Blocked, invalid body, or `stream=true`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OpenAIError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '502':
          description: Upstream error, or the reply was blocked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OpenAIError' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /api/runtime-security/proxy/anthropic/v1/messages:
    post:
      tags: [Proxy]
      summary: Wire-compatible Anthropic Messages proxy
      description: |
        Body and response match `POST https://api.anthropic.com/v1/messages`.
        Blindsight scans both directions.

        **Streaming**: `stream=true` is supported. A block ends the stream with
        a terminal event.

        **Headers**: `x-api-key` is for Anthropic and is forwarded upstream.
        Authenticate to Blindsight with `X-Blindsight-Key` (permission
        `runtime:scan`).
      operationId: proxyAnthropicMessages
      security:
        - BlindsightKeyAuth: []
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/AppId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
            example:
              model: claude-opus-4-6
              max_tokens: 1024
              messages:
                - { role: user, content: "Hello" }
      responses:
        '200':
          description: |
            Non-streaming returns an Anthropic Message; streaming returns SSE
            events.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
            text/event-stream:
              schema: { type: string }
        '400':
          description: Blocked or invalid body
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnthropicError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '502':
          description: Upstream error, or the reply was blocked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnthropicError' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /api/runtime-security/proxy/openai-compatible/v1/chat/completions:
    post:
      tags: [Proxy]
      summary: OpenAI-compatible chat proxy (Groq, DeepSeek, Perplexity, Mistral, OpenRouter, Cerebras, self-hosted)
      description: |
        Same body as OpenAI Chat Completions. Choose the upstream with the
        `X-Blindsight-Upstream-Provider` header (`groq`, `deepseek`,
        `perplexity`, `mistral`, `openrouter` or `cerebras`) or, for a
        self-hosted runtime the deployment has allowed, with
        `X-Blindsight-Upstream-Base`. An App whose routing names an upstream
        uses it when neither header is sent. Streaming is supported.

        Requires the `runtime:scan` permission.
      operationId: proxyOpenAICompatChat
      parameters:
        - $ref: '#/components/parameters/AppId'
        - name: X-Blindsight-Upstream-Provider
          in: header
          required: false
          schema: { type: string, enum: [groq, deepseek, perplexity, mistral, openrouter, cerebras] }
        - name: X-Blindsight-Upstream-Base
          in: header
          required: false
          schema: { type: string }
          description: Base URL of an allowed self-hosted runtime.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200':
          description: The upstream response, or an SSE stream
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
            text/event-stream:
              schema: { type: string }
        '400':
          description: Blocked, invalid body, or no upstream could be chosen
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OpenAIError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '502':
          description: Upstream error, or the reply was blocked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OpenAIError' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /api/runtime-security/proxy/openai-compatible/v1/completions:
    post:
      tags: [Proxy]
      summary: OpenAI-compatible legacy Completions proxy
      description: |
        As the chat route, for `/v1/completions`. Streaming is not supported.

        Requires the `runtime:scan` permission.
      operationId: proxyOpenAICompatCompletions
      parameters:
        - $ref: '#/components/parameters/AppId'
        - name: X-Blindsight-Upstream-Provider
          in: header
          required: false
          schema: { type: string, enum: [groq, deepseek, perplexity, mistral, openrouter, cerebras] }
        - name: X-Blindsight-Upstream-Base
          in: header
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200':
          description: The upstream response
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '400':
          description: Blocked, invalid body, `stream=true`, or no upstream could be chosen
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OpenAIError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '502':
          description: Upstream error, or the reply was blocked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OpenAIError' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /api/runtime-security/proxy/gemini/v1beta/models/{model}:{action}:
    post:
      tags: [Proxy]
      summary: Google Gemini proxy
      description: |
        `action` is `generateContent` or `streamGenerateContent`; any other
        action returns `400` with the status `unsupported_endpoint`. Send your
        Google key in `x-goog-api-key`. Authenticate to Blindsight with
        `X-API-Key` (permission `runtime:scan`).
      operationId: proxyGemini
      parameters:
        - $ref: '#/components/parameters/AppId'
        - { name: model, in: path, required: true, schema: { type: string }, example: gemini-1.5-pro }
        - { name: action, in: path, required: true, schema: { type: string, enum: [generateContent, streamGenerateContent] } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
            example:
              contents:
                - { role: user, parts: [{ text: "Hello" }] }
      responses:
        '200':
          description: The Gemini response, or an SSE stream
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
            text/event-stream:
              schema: { type: string }
        '400':
          description: Blocked, invalid body, or unsupported action
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GoogleError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '502':
          description: Upstream error, or the reply was blocked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GoogleError' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /api/runtime-security/proxy/vertex/v1/projects/{project}/locations/{location}/publishers/{publisher}/models/{model}:{action}:
    post:
      tags: [Proxy]
      summary: Google Vertex AI proxy
      description: |
        `action` is `generateContent` or `streamGenerateContent`. Send your
        Google OAuth token in `Authorization: Bearer`. Authenticate to
        Blindsight with `X-API-Key` (permission `runtime:scan`). The proxy
        routes to `https://{location}-aiplatform.googleapis.com`.
      operationId: proxyVertex
      parameters:
        - $ref: '#/components/parameters/AppId'
        - { name: project, in: path, required: true, schema: { type: string } }
        - { name: location, in: path, required: true, schema: { type: string }, example: us-central1 }
        - { name: publisher, in: path, required: true, schema: { type: string }, example: google }
        - { name: model, in: path, required: true, schema: { type: string } }
        - { name: action, in: path, required: true, schema: { type: string, enum: [generateContent, streamGenerateContent] } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200':
          description: The Vertex response, or an SSE stream
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
            text/event-stream:
              schema: { type: string }
        '400':
          description: Blocked, invalid body, or unsupported path
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GoogleError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '502':
          description: Upstream error, or the reply was blocked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GoogleError' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /api/runtime-security/proxy/bedrock/model/{modelId}/converse:
    post:
      tags: [Proxy]
      summary: AWS Bedrock Converse proxy
      description: |
        The proxy signs the upstream call with AWS SigV4 using the credentials
        you pass in the `X-Blindsight-AWS-*` headers. Streaming
        (`converse-stream`) is not available. Authenticate to Blindsight with
        `X-API-Key` (permission `runtime:scan`).
      operationId: proxyBedrockConverse
      parameters:
        - $ref: '#/components/parameters/AppId'
        - { name: modelId, in: path, required: true, schema: { type: string }, example: "anthropic.claude-3-5-sonnet-20241022-v2:0" }
        - { name: X-Blindsight-AWS-Access-Key-Id, in: header, required: true, schema: { type: string } }
        - { name: X-Blindsight-AWS-Secret-Access-Key, in: header, required: true, schema: { type: string } }
        - { name: X-Blindsight-AWS-Session-Token, in: header, required: false, schema: { type: string }, description: Only for temporary credentials. }
        - { name: X-Blindsight-AWS-Region, in: header, required: true, schema: { type: string }, example: us-east-1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
            example:
              messages:
                - { role: user, content: [{ text: "Hello" }] }
      responses:
        '200':
          description: The Bedrock Converse response
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '400':
          description: Blocked, invalid body, or missing or invalid region
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BedrockError' }
        '401':
          description: No Blindsight credential, or missing AWS credentials (`missing_credentials`)
        '403': { $ref: '#/components/responses/Forbidden' }
        '502':
          description: Upstream error, or the reply was blocked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BedrockError' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /api/runtime-security/config:
    get:
      tags: [Configuration]
      summary: Read the workspace settings
      description: |
        Requires the `runtime:config:read` permission. The response carries
        further fields used by the console and the desktop app; only the
        fields in the schema are part of the supported contract.
      operationId: getConfig
      responses:
        '200':
          description: Current settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RuntimeSecurityConfig' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotEnabled' }
    put:
      tags: [Configuration]
      summary: Update workspace settings
      description: |
        Requires the `runtime:config:write` permission. The update merges: it
        changes the fields you send and leaves the rest alone. Toggling
        `enabled` scales the firewall service. Limited to 6 requests per
        minute.
      operationId: updateConfig
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RuntimeSecurityConfig' }
            example: { log_events: true, pre_prompt_placement: prepend }
      responses:
        '200':
          description: New settings (after persistence)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RuntimeSecurityConfig' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /api/runtime-security/analytics:
    get:
      tags: [Analytics]
      summary: Aggregate verdict and personal data counts over a time window
      description: Requires the `runtime:events:read` permission.
      operationId: getAnalytics
      parameters:
        - name: days
          in: query
          schema: { type: integer, minimum: 1, maximum: 3650, default: 14 }
          description: The last N days. Ignored when `minutes` or `start` and `end` are set.
        - name: minutes
          in: query
          schema: { type: integer, minimum: 1, maximum: 5256000 }
          description: The last N minutes. Overrides `days`.
        - name: start
          in: query
          schema: { type: string, format: date-time }
          description: Start of an absolute window (UTC). Requires `end`.
        - name: end
          in: query
          schema: { type: string, format: date-time }
          description: End of an absolute window (UTC). Requires `start` and must be after it.
        - name: app
          in: query
          schema: { type: array, items: { type: string } }
          style: form
          explode: true
          description: App UUID. Repeat to include several Apps. An unknown App returns `400`.
      responses:
        '200':
          description: Aggregates
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalyticsResponse' }
              example:
                range_days: 7
                range_minutes: 10080
                bucket_seconds: 86400
                totals: { total: 6200, input: 4100, output: 2050, tool_call: 50, pii_hits: 210, injection_hits: 31 }
                verdict_breakdown: { allow: 5950, flag: 12, redact: 210, block: 28 }
                pii_category_breakdown: { email: 120, phone: 55, person: 35 }
                avg_latency_ms: null
                p95_latency_ms: null
                series:
                  - { date: "2026-10-28", allow: 850, flag: 2, redact: 30, block: 4, total: 886 }
        '400':
          description: Only one of `start` and `end`, `end` not after `start`, or an unknown App
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotEnabled' }

  /api/runtime-security/events:
    get:
      tags: [Analytics]
      summary: Paginated event log
      description: |
        Newest first. Includes events from the desktop app as well as from API
        and SDK calls. Requires the `runtime:events:read` permission (or, for
        desktop app events, a key created for Endpoint with **Read endpoint
        events**).
      operationId: getEvents
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
          description: "Number of events to skip. Results are newest first."
        - name: date_from
          in: query
          schema: { type: string, format: date }
          description: "Events from this day onwards (UTC, inclusive)."
        - name: date_to
          in: query
          schema: { type: string, format: date }
          description: "Events up to and including this day (UTC). Defaults to today."
        - name: days
          in: query
          schema: { type: integer, minimum: 1, maximum: 3650 }
          description: "The last N days, today included. Ignored when date_from is set."
        - name: verdict
          in: query
          schema: { type: string, enum: [allow, flag, redact, block] }
        - name: direction
          in: query
          schema: { type: string, enum: [input, output, tool_call] }
        - name: device_only
          in: query
          schema: { type: boolean, default: false }
          description: "Only events from enrolled desktop app devices."
      responses:
        '200':
          description: Page of events
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventsPage' }
              example:
                total: 137
                identity_mode: named
                items:
                  - uuid: "6b0f3c1e-2a4d-4f57-9a1e-0c5d8e7b4a12"
                    created_at: "2026-11-02T14:07:31Z"
                    verdict: flag
                    direction: input
                    reason: prompt_injection
                    provider: openai
                    source_app: chatgpt.com
                    model: gpt-4o
                    device_hostname: LAPTOP-0042
                    device_os_user: jsmith
                    process_name: chrome.exe
                    user_email: jsmith@example.com
                    pii_categories: []
                    redacted_text: "Summarise this document for me"
                    text_length: 31
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotEnabled' }

  /api/runtime-security/events/{uuid}/explain:
    get:
      tags: [Analytics]
      summary: One event
      description: |
        Returns the same fields as an item of the event list, plus
        `identity_mode`. Requires the `runtime:events:read` permission.
      operationId: getEvent
      parameters:
        - name: uuid
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The event
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Event'
                  - type: object
                    properties:
                      identity_mode: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No such event in this workspace

  /api/runtime-security/drift:
    get:
      tags: [Analytics]
      summary: Population Stability Index per dimension
      description: |
        Compares a recent window with a longer baseline window for the
        dimensions `verdict`, `direction`, `source_app`, `model`, `provider`
        and `pii_category`. Requires the `runtime:events:read` permission.
      operationId: getDrift
      parameters:
        - name: baseline_days
          in: query
          schema: { type: integer, minimum: 2, maximum: 365, default: 30 }
        - name: recent_days
          in: query
          schema: { type: integer, minimum: 1, maximum: 90, default: 7 }
          description: Must be smaller than `baseline_days`.
        - name: app
          in: query
          schema: { type: array, items: { type: string } }
          style: form
          explode: true
          description: App UUID. Repeat to include several Apps. An unknown App returns `400`.
      responses:
        '200':
          description: Drift report
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriftResponse' }
        '400':
          description: "`recent_days` is not smaller than `baseline_days`, or an unknown App"
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotEnabled' }

  /api/runtime-security/health:
    get:
      tags: [Health]
      summary: Whether the firewall is on and ready to scan
      description: |
        Requires the `runtime:events:read` permission. The response carries
        further fields for operators; only `enabled` and `status` are part of
        the supported contract.
      operationId: getHealth
      responses:
        '200':
          description: Health status
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled: { type: boolean }
                  status: { type: string, enum: [ready, degraded, disabled] }
              example: { enabled: true, status: ready }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotEnabled' }

  /api/runtime-security/service-status:
    get:
      tags: [Health]
      summary: Whether the firewall service is running
      description: |
        Requires the `runtime:events:read` permission. The response carries
        further fields that describe the hosting deployment; only
        `provisioned` and `ready` are part of the supported contract.
      operationId: getServiceStatus
      responses:
        '200':
          description: Current service state
          content:
            application/json:
              schema:
                type: object
                properties:
                  provisioned: { type: boolean }
                  ready:
                    type: boolean
                    description: True when at least one firewall instance is running.
              example: { provisioned: true, ready: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503':
          description: The service state could not be read

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: |
        Blindsight API key (`ak_...`). The permissions it needs are listed in
        the API description and on each operation: `runtime:scan` for scan and
        proxy routes, `runtime:events:read` for events, analytics, drift,
        health and service status, `runtime:config:read` to read the
        configuration and `runtime:config:write` to change it.
    BlindsightKeyAuth:
      type: apiKey
      in: header
      name: X-Blindsight-Key
      description: |
        Alternative header for proxy callers whose client already uses
        `x-api-key` for the upstream provider, such as the Anthropic SDK.
        Accepts a Blindsight API key with the `runtime:scan` permission.

  parameters:
    AppId:
      name: X-Blindsight-App-Id
      in: header
      required: false
      schema: { type: string }
      description: |
        UUID of the App the traffic belongs to. Optional: a key limited to one
        App, or a workspace with exactly one App, uses that App. A key limited
        to several Apps must send it.

  responses:
    Unauthorized:
      description: The API key is missing, invalid, expired or disabled
      content:
        application/json:
          schema:
            type: object
            properties:
              detail: { type: string }
    Forbidden:
      description: The key does not have the permission this endpoint needs, or its owner no longer holds it
      content:
        application/json:
          schema:
            type: object
            properties:
              detail: { type: string }
    NotEnabled:
      description: Runtime Security (or the module this endpoint belongs to) is not enabled for the workspace
    QuotaExceeded:
      description: The workspace has used its request allowance for the current period
      content:
        application/json:
          schema:
            type: object
            properties:
              detail:
                type: object
                properties:
                  code: { type: string, enum: [QUOTA_EXCEEDED] }
                  message: { type: string }
                  resets_at: { type: string }
                  upgrade_url: { type: string }
    PayloadTooLarge:
      description: A text field is longer than the workspace limit
      content:
        application/json:
          schema:
            type: object
            properties:
              detail:
                type: object
                properties:
                  code: { type: string, enum: [PAYLOAD_TOO_LARGE] }
                  message: { type: string }
                  field: { type: string }
                  length: { type: integer }
                  max_text_length: { type: integer }
    ValidationError:
      description: Request body failed schema validation
      content:
        application/json:
          schema:
            type: object
            properties:
              detail:
                type: array
                items:
                  type: object
                  properties:
                    loc: { type: array, items: { type: string } }
                    msg: { type: string }
                    type: { type: string }
    RateLimited:
      description: Rate limit reached for this API key
    Unavailable:
      description: The firewall is disabled or still starting
      content:
        application/json:
          schema:
            type: object
            properties:
              detail: { type: string }

  schemas:
    ScanInputRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
          description: The prompt about to be sent to the LLM. Up to `max_text_length` characters (32000 by default).
        session_id:
          type: string
          maxLength: 200
          description: Your identifier for the conversation or agent run.
        history:
          type: array
          maxItems: 16
          description: Earlier turns of the conversation, oldest first. Each entry is a string or an object with `role` and `content`.
          items:
            oneOf:
              - type: string
              - type: object
                required: [content]
                properties:
                  role: { type: string, enum: [user, assistant, system, tool_result] }
                  content: {}
        untrusted:
          type: array
          maxItems: 32
          description: Parts of the prompt that did not come from the user, such as retrieved documents.
          items:
            type: object
            required: [content]
            properties:
              content: { type: string }
              source:
                type: string
                enum: [retrieval, tool_result, web, email, file, document, user_upload, other]
                default: retrieval
              label: { type: string, maxLength: 128 }
        source_app:
          type: string
          maxLength: 128
          description: Free-form app identifier kept on the audit row.
        provider: { type: string, maxLength: 32 }
        model: { type: string, maxLength: 128 }
        metadata:
          type: object
          additionalProperties: true
        custom_params:
          type: object
          additionalProperties: true
          description: Typed key and value pairs declared by the resolved App.

    ScanOutputRequest:
      type: object
      required: [response]
      properties:
        response:
          type: string
          description: The LLM response about to be shown to the user. Up to `max_text_length` characters.
        prompt:
          type: string
          description: The prompt that produced the response (for context).
        session_id: { type: string, maxLength: 200 }
        source_app: { type: string, maxLength: 128 }
        provider: { type: string, maxLength: 32 }
        model: { type: string, maxLength: 128 }
        metadata:
          type: object
          additionalProperties: true
        custom_params:
          type: object
          additionalProperties: true

    ScanBatchItem:
      type: object
      required: [text]
      properties:
        text: { type: string }
        direction:
          type: string
          enum: [input, output]
          default: input
        source_app: { type: string, maxLength: 128 }
        provider: { type: string, maxLength: 32 }
        model: { type: string, maxLength: 128 }
        metadata:
          type: object
          additionalProperties: true

    ScanBatchRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 32
          items: { $ref: '#/components/schemas/ScanBatchItem' }

    ScanBatchResponse:
      type: object
      properties:
        results:
          type: array
          items: { $ref: '#/components/schemas/ScanResponse' }

    ScanToolCallRequest:
      type: object
      required: [tool_name]
      properties:
        tool_name:
          type: string
          maxLength: 200
        arguments:
          description: "Tool arguments: any JSON value. Defaults to an empty object."
        session_id: { type: string, maxLength: 200 }
        source_app: { type: string, maxLength: 128 }
        provider: { type: string, maxLength: 32 }
        model: { type: string, maxLength: 128 }
        metadata:
          type: object
          additionalProperties: true

    ScanResponse:
      type: object
      required: [uuid, verdict, pii, redacted_text, latency_ms, text_length]
      properties:
        uuid:
          type: string
          description: Event identifier. Empty when the workspace has event logging turned off.
        verdict:
          type: string
          enum: [allow, flag, redact, block]
          description: |
            `flag` records a suspicion without changing the traffic. See the
            Verdicts guide.
        pii:
          type: object
          properties:
            count: { type: integer, minimum: 0 }
            categories:
              type: array
              items: { type: string }
        redacted_text:
          type: string
          description: |
            The text with detected personal data replaced by `<CATEGORY>`
            markers. Equal to the original when nothing was redacted.
        text_length:
          type: integer
          minimum: 0
          description: Length of the scanned text in characters.
        latency_ms:
          type: integer
          minimum: 0

    ScanToolCallResponse:
      type: object
      required: [uuid, verdict, reasons, redacted_arguments, pii, arg_bytes, latency_ms]
      properties:
        uuid:
          type: string
          description: Event identifier. Empty when event logging is off.
        verdict:
          type: string
          enum: [allow, redact, block]
        reasons:
          type: array
          description: The rules that applied.
          items:
            type: object
            properties:
              code:
                type: string
                description: |
                  For example `tool.denied` (the tool is on the deny list),
                  `tool.not_allowed` (an allow list exists and the tool is not
                  on it) or `tool.args_too_large` (the arguments exceed the
                  size limit).
              severity: { type: string }
              detail: { type: string }
        redacted_arguments:
          description: The arguments with personal data masked.
        pii:
          type: object
          properties:
            count: { type: integer }
            categories:
              type: array
              items: { type: string }
        arg_bytes:
          type: integer
          description: Size of the JSON-serialised arguments in bytes.
        latency_ms: { type: integer }

    AgenticPolicyConfig:
      type: object
      properties:
        tool_allowlist:
          type: array
          items: { type: string }
        tool_denylist:
          type: array
          items: { type: string }
        max_arg_bytes:
          type: integer
          minimum: 256
          maximum: 1000000
          default: 32000
        allow_private_network:
          type: boolean
          default: false

    RuntimeSecurityConfig:
      type: object
      properties:
        enabled: { type: boolean, default: true }
        max_text_length:
          type: integer
          minimum: 256
          maximum: 200000
          default: 32000
          description: Characters. A scan field longer than this is refused with `413`.
        log_events:
          type: boolean
          default: true
        pre_prompt:
          type: string
          maxLength: 20000
          nullable: true
        pre_prompt_placement:
          type: string
          enum: [prepend, append, sandwich]
          default: prepend
        agentic: { $ref: '#/components/schemas/AgenticPolicyConfig' }
        file_scanning_enabled:
          type: boolean
          default: true
          description: Scan file uploads as well as prompt text.
        file_unredactable_action:
          type: string
          enum: [block, allow]
          default: block
          description: >
            What happens when a file contains personal data and its format has
            no in-file redactor.
        pseudonymize_enabled:
          type: boolean
          default: false
          description: >
            Replace detected values with reversible surrogates instead of a
            placeholder, so the reply can be restored on the way back.
        pseudonymize_labels:
          type: object
          description: Per-label overrides for which categories are pseudonymized.
        pseudonymize_retention_days:
          type: integer
          minimum: 1
          maximum: 365
          default: 30
          description: How long a surrogate stays resolvable back to its value.
        dlp_fail_mode:
          type: string
          enum: [open, closed]
          default: open
          description: >
            What the endpoint agent does when it cannot inspect an AI
            destination. `closed` refuses the connection.
        dlp_fail_mode_locked:
          type: boolean
          default: false
          description: Prevents a device changing its own fail mode.
        dlp_protect_unsanctioned:
          type: boolean
          default: false
          description: >
            The posture towards AI services nobody has approved.
        dlp_host_rule_overrides:
          type: array
          description: >
            Per-host rules that override the built-in AI host list, each naming a
            host pattern, how to match it, and what to do.
          items:
            type: object
        identity_mode:
          type: string
          enum: [named, pseudonymised, aggregated]
          default: named
          description: Whether people and devices are named, shown as codes, or shown as totals only.

    AnalyticsResponse:
      type: object
      properties:
        range_days: { type: integer }
        range_minutes: { type: integer }
        bucket_seconds:
          type: integer
          description: Width of one `series` bucket in seconds.
        totals:
          type: object
          properties:
            total: { type: integer }
            input: { type: integer }
            output: { type: integer }
            tool_call: { type: integer }
            pii_hits:
              type: integer
              description: Events with personal data.
            injection_hits:
              type: integer
              description: Events with an injection finding.
        verdict_breakdown:
          type: object
          properties:
            allow: { type: integer }
            flag: { type: integer }
            redact: { type: integer }
            block: { type: integer }
        avg_latency_ms:
          type: number
          nullable: true
          description: "`null` unless the key's owner may view firewall latency."
        p95_latency_ms:
          type: number
          nullable: true
        pii_category_breakdown:
          type: object
          additionalProperties: { type: integer }
        series:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
                description: Bucket start in UTC (`YYYY-MM-DD`, or `YYYY-MM-DDTHH:MM` for windows of a day or less).
              allow: { type: integer }
              flag: { type: integer }
              redact: { type: integer }
              block: { type: integer }
              total: { type: integer }

    EventsPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Event' }
        total:
          type: integer
          description: Number of events that match the filters.
        identity_mode:
          type: string
          description: Whether people and devices are named or shown as codes.

    Event:
      type: object
      properties:
        uuid: { type: string }
        created_at:
          type: string
          format: date-time
          description: UTC, ISO 8601, ending in `Z`.
        direction: { type: string, enum: [input, output, tool_call] }
        verdict:
          type: string
          enum: [allow, flag, redact, block]
          description: "`flag` filters also return redacted or blocked events that carried an injection."
        reason:
          type: string
          nullable: true
          enum: [prompt_injection, harmful_content, pii, policy]
          description: Why the event is not a clean pass.
        provider: { type: string, nullable: true }
        source_app:
          type: string
          nullable: true
          description: The service host.
        model: { type: string, nullable: true }
        device_hostname: { type: string, nullable: true }
        device_os_user: { type: string, nullable: true }
        process_name: { type: string, nullable: true }
        user_email: { type: string, nullable: true }
        pii_categories:
          type: array
          items: { type: string }
        redacted_text:
          type: string
          nullable: true
          description: The stored text according to the workspace privacy settings.
        text_length: { type: integer }

    DriftResponse:
      type: object
      properties:
        baseline:
          $ref: '#/components/schemas/DriftWindow'
        recent:
          $ref: '#/components/schemas/DriftWindow'
        dimensions:
          type: array
          description: Sorted with the largest shift first.
          items:
            type: object
            properties:
              name: { type: string }
              label: { type: string }
              psi: { type: number }
              severity: { type: string, enum: [stable, moderate, high] }
              baseline_distribution:
                type: object
                additionalProperties: { type: number }
              recent_distribution:
                type: object
                additionalProperties: { type: number }
              top_shifts:
                type: array
                items:
                  type: object
                  properties:
                    category: { type: string }
                    baseline_share: { type: number }
                    recent_share: { type: number }
                    delta: { type: number }
                    baseline_count: { type: integer }
                    recent_count: { type: integer }
              psi_series:
                type: array
                items:
                  type: object
                  properties:
                    date: { type: string }
                    psi: { type: number }
        daily_volume:
          type: array
          items:
            type: object
            properties:
              date: { type: string }
              count: { type: integer }

    DriftWindow:
      type: object
      properties:
        start:
          type: string
          description: Start of the window, UTC.
        end:
          type: string
          description: End of the window, UTC.
        total_events: { type: integer }

    OpenAIError:
      type: object
      properties:
        error:
          type: object
          properties:
            message: { type: string }
            type: { type: string }
            code:
              type: string
              description: "`blindsight_blocked`, `upstream_blocked` or `upstream_error`."
            param:
              type: string
              nullable: true

    AnthropicError:
      type: object
      properties:
        type: { type: string, enum: [error] }
        error:
          type: object
          properties:
            type: { type: string }
            message: { type: string }

    GoogleError:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: integer }
            status:
              type: string
              description: "`blindsight_blocked`, `upstream_error`, `upstream_blocked` or `unsupported_endpoint`."
            message: { type: string }

    BedrockError:
      type: object
      properties:
        message: { type: string }
        type:
          type: string
          description: "`blindsight_blocked`, `missing_credentials`, `missing_region`, `upstream_blocked` or `sign_error`."
