  /api/auth/token/refresh:
    post:
      tags:
      - auth
      summary: Refresh Token
      description: 'Issue a new access token before the current one expires.


        This endpoint allows clients to extend their session without re-authenticating.

        The current token must still be valid to obtain a new one.'
      operationId: refresh_token_api_auth_token_refresh_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
  /api/auth/csrf:
    get:
      tags:
      - auth
      summary: Get Csrf
      description: 'Issue/refresh the double-submit CSRF cookie and return its value.


        The SPA calls this on load so a session that predates the CSRF cookie still

        obtains one. Safe to call unauthenticated (it only mints a random token).'
      operationId: get_csrf_api_auth_csrf_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Get Csrf Api Auth Csrf Get
  /api/auth/logout:
    post:
      tags:
      - auth
      summary: Logout
      description: 'Clear the authentication cookie AND revoke outstanding tokens.


        Sessions are stateless JWTs, so clearing the cookie alone left a captured

        bearer token valid until expiry. Bumping ``token_valid_after`` (the same

        cutoff resolve_user_from_request already enforces) invalidates every token

        issued before now for this user.'
      operationId: logout_api_auth_logout_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/datasets:
    get:
      tags:
      - api
      - datasets
      summary: List Datasets
      operationId: list_datasets_api_datasets_get
      parameters:
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Q
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 20
          title: Per Page
      - name: include_branches
        in: query
        required: false
        schema:
          type: boolean
          description: Include non-main branch datasets in the response.
          default: false
          title: Include Branches
        description: Include non-main branch datasets in the response.
      - name: include_removed
        in: query
        required: false
        schema:
          type: boolean
          description: Include removed datasets in the response.
          default: false
          title: Include Removed
        description: Include removed datasets in the response.
      - name: include_issue_counts
        in: query
        required: false
        schema:
          type: boolean
          description: Include per-dataset issue breakdowns (mislabel/outlier/poison). Disabling is faster.
          default: true
          title: Include Issue Counts
        description: Include per-dataset issue breakdowns (mislabel/outlier/poison). Disabling is faster.
      - name: include_type_counts
        in: query
        required: false
        schema:
          type: boolean
          description: Include vulnerability type counters and inferred issue types. Disabling is faster.
          default: true
          title: Include Type Counts
        description: Include vulnerability type counters and inferred issue types. Disabling is faster.
      - name: sort_by
        in: query
        required: false
        schema:
          enum:
          - name
          - updated_at
          - created_at
          - size_bytes
          - last_scan_at
          - status
          - severity
          type: string
          default: name
          title: Sort By
      - name: sort_order
        in: query
        required: false
        schema:
          enum:
          - asc
          - desc
          type: string
          default: asc
          title: Sort Order
      - name: type[]
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          description: Filter datasets by primary issue type (e.g., Mislabeled, Outlier, Poisoned, N/A).
          title: Type[]
        description: Filter datasets by primary issue type (e.g., Mislabeled, Outlier, Poisoned, N/A).
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - api
      - datasets
      summary: Create Dataset
      operationId: create_dataset_api_datasets_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatasetCreateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetCreateResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
