      summary: Admin List Fleet Device Rules
      description: 'Every machine in the workspace carrying rules of its own.


        Devices with no device-scoped rows are left out: the console already lists

        the fleet, and this answers the narrower question of where somebody has

        written something on top of it. The caller reads it as a map keyed by

