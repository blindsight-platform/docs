                $ref: '#/components/schemas/HTTPValidationError'
  /api/runtime-security/agent/devices/{device_uuid}/rebind:
    post:
      tags:
      - runtime-security-agent
      summary: Rebind Device
      description: 'Clear a device''s identity so the next employee must re-do SSO binding.


        Used when a machine is reassigned to a different employee.


        The pause goes with the identity, the same way ``_release_devices_of``

        already drops it when an account is closed. Leaving it behind was the worst

        possible hand-over: the next employee got a laptop with inspection silently

        off, attributed in the console to somebody who no longer has the machine,

        and NEITHER of them could turn it back on -- the pause can only be lifted

        by the person who set it or by an admin who first notices it is there, and

        nothing about a reassigned machine says to go looking.'
      operationId: rebind_device_api_runtime_security_agent_devices__device_uuid__rebind_post
      parameters:
      - name: device_uuid
        in: path
        required: true
        schema:
          type: string
          title: Device Uuid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
