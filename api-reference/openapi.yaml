      - users
      summary: Put User Permission Overrides
      description: 'Grant or withdraw permissions for one person, on top of their roles.


        Gated on ``users.assign_roles`` rather than ``users.edit``: this hands out

        capability exactly as assigning a role does, and gating it on the weaker

        grant would make the role rule pointless. It is bounded further by

        :func:`permissions_actor_cannot_grant`, nobody can give away more than

        they hold, and the role-escalating permissions never travel this way.'
