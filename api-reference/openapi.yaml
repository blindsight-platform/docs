  /api/runtime-security/agent/rules/{name}:
    put:
      tags:
      - runtime-security-agent
      summary: Upsert Device Rule
      description: 'Add or edit a rule for this device alone.


        Using an existing workspace rule''s name replaces it here, which is a way of

        weakening the company''s own floor on this machine and so needs

        ``rules.override_workspace`` on top of the ordinary grant. So does using

        the name of a detector the agent ships: the agent merges by name, so a row

        called ``credit_card`` replaces card detection on this endpoint even though

        no workspace row exists to compare it against.


        Neither check reads ``enabled``, and that is the point. A row that says

        ``enabled: true`` and carries a pattern matching nothing removes the

        detector exactly as thoroughly as ``enabled: false`` does, while every

        surface -- the rules tab, the policy payload, the audit record -- reports

        the rule as on. Any gate phrased in terms of ``enabled`` misses that.'
      operationId: upsert_device_rule_api_runtime_security_agent_rules__name__put
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
          title: Name
      - name: X-Blindsight-Device-Token
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Blindsight-Device-Token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceRuleUpsert'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - runtime-security-agent
      summary: Delete Device Rule
      description: 'Remove one of this device''s own rules. Workspace rules are not deletable

        from here, switching one off is the strongest a device may go.'
      operationId: delete_device_rule_api_runtime_security_agent_rules__name__delete
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
          title: Name
      - name: X-Blindsight-Device-Token
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Blindsight-Device-Token
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/runtime-security/agent/rules/{name}/toggle:
    post:
      tags:
      - runtime-security-agent
      summary: Toggle Rule
      description: 'Switch a rule on or off for this device.


        Switching off a workspace rule, or one of the detectors the agent ships, is

        a separate grant from managing your own: one is housekeeping on rules you

        wrote, the other lowers the floor your organisation set.


        Putting the company''s rule BACK is the one direction that needs no extra

        grant. It deletes this device''s override and returns the machine to the

        workspace, which can only ever make it detect more.'
      operationId: toggle_rule_api_runtime_security_agent_rules__name__toggle_post
      parameters:
      - name: name
        in: path
