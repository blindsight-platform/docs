  /api/runtime-security/agent/protection/pause:
    post:
      tags:
      - runtime-security-agent
      summary: Agent Set Pause
      description: 'Pause or resume inspection on the calling device.


        Authenticated by the DEVICE token but authorised against the PERSON the

        device is bound to. The desktop app runs as the person being governed, so

        a check inside it would be a suggestion; this is where the answer is

        decided, and the app follows it.


        Refused when the device is not bound to anyone: an unattributed machine

        has no one whose permission could be checked, and "some device paused

        itself" is not something an admin can hold anybody to.'
      operationId: agent_set_pause_api_runtime_security_agent_protection_pause_post
      parameters:
      - name: X-Blindsight-Device-Token
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Blindsight-Device-Token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PauseRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - runtime-security-agent
      summary: Agent Get Pause
      description: "Whether this device is paused, and whether its person may change that.\n\n``allowed``\
        \ is what the desktop app uses to decide if the toggle is even\noffered. It is a courtesy, not\
        \ the control: the POST above is what\nactually enforces it -- but both read the same\n:func:`pause_authority`,\
        \ because a courtesy that disagrees with the\ncontrol is worse than no courtesy at all.\n\n``reason``\
        \ / ``reason_message`` say WHY it is refused. Without them the app\ncould only grey the switch\
        \ out and say nothing, leaving the person to guess\nbetween \"your admin has not allowed this\"\
        , \"nobody has proved this machine\nis yours\" and \"the product is broken\".\n\n``reason`` is\
        \ the stable code to branch on; ``reason_message`` is the\nsentence the app shows the person unchanged,\
        \ so it is written for them and\nnot for us. The codes are:\n\n``device_identity_unverified``\
        \   this machine's owner is unproved, and the\n                                 person can fix\
        \ it by signing in\n``identity_binding_unavailable`` same gate, but the workspace has no SSO,\n\
        \                                 so only an administrator can fix it\n``device_unattributed``\
        \          no person on the device to check at all\n``owner_inactive``               the account\
        \ it belongs to is switched off\n``permission_denied``            proved owner, permission not\
        \ granted\n``null``                         nothing is refused (``allowed`` is true)"
      operationId: agent_get_pause_api_runtime_security_agent_protection_pause_get
      parameters:
      - name: X-Blindsight-Device-Token
        in: header
        required: false
