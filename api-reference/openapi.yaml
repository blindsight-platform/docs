      description: 'One machine''s own rules, and what each does to the company''s detection.


        A device in another workspace is a 404, not a 403: saying "forbidden"

        confirms the machine exists.'
      operationId: admin_list_device_rules_api_runtime_security_agent_devices__device_uuid__rules_get
      parameters:
