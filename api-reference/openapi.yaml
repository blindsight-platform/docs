openapi: 3.1.0
info:
  title: Blindsight API
  version: 0.1.0
  description: 'The full Blindsight REST surface, generated from the running application. Replace the
    server host with your own deployment.


    For the Runtime Security integration surface (scan, proxy, tool calls) see the Runtime Security spec,
    which is hand written and carries worked examples.'
paths:
  /api/auth/password/forgot:
    post:
      tags:
      - auth
      summary: Request Password Reset
      description: 'Request a password reset link.


        Security: always returns ok (no user enumeration).'
      operationId: request_password_reset_api_auth_password_forgot_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetEmailRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Request Password Reset Api Auth Password Forgot Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/auth/password/reset/confirm:
    post:
      tags:
      - auth
      summary: Confirm Password Reset
      operationId: confirm_password_reset_api_auth_password_reset_confirm_post
      requestBody:
        content:
          application/json:
