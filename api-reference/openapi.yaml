        schema:
          anyOf:
          - type: string
            pattern: ^(input|output|tool_call)$
          - type: 'null'
          title: Direction
      - name: app
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          description: App UUID(s) to filter by
          default: []
          title: App
        description: App UUID(s) to filter by
      - name: device
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          description: Device UUID(s) to filter by
          default: []
          title: Device
        description: Device UUID(s) to filter by
      - name: user
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 255
          - type: 'null'
          description: Filter to events from devices belonging to this user, matches the bound directory
            email, or the OS account / hostname for devices that haven't completed SSO binding (the same
            labels the DLP Users tab shows).
          title: User
        description: Filter to events from devices belonging to this user, matches the bound directory
          email, or the OS account / hostname for devices that haven't completed SSO binding (the same
          labels the DLP Users tab shows).
      - name: provider
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
          title: Provider
      - name: source_app
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 128
          - type: 'null'
          title: Source App
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 200
          - type: 'null'
          description: Case-insensitive substring match across event id, direction, verdict, injection
            label, source app, provider, model, blocked reason, and PII categories. Applied before pagination,
            so `total` reflects the filtered count.
          title: Q
        description: Case-insensitive substring match across event id, direction, verdict, injection label,
          source app, provider, model, blocked reason, and PII categories. Applied before pagination,
          so `total` reflects the filtered count.
      - name: device_only
        in: query
        required: false
        schema:
          type: boolean
          description: Only events from enrolled DLP desktop agents (device_id set)
          default: false
          title: Device Only
        description: Only events from enrolled DLP desktop agents (device_id set)
      - name: include_facets
        in: query
        required: false
        schema:
          type: boolean
          description: Include distinct source_app / provider values for the current scope (workspace
            + device_only) so clients can build filter dropdowns without paging through events.
          default: false
