  /api/runtime-security/agent/devices/{device_uuid}/allow-reenrollment:
    post:
      tags:
      - runtime-security-agent
      summary: Allow Device Reenrollment
      description: 'Clear ONE revoked machine to enrol again, once.


        This is what makes refusing safe. Enrolment refuses a revoked hardware_id

        outright, which is the only way revocation survives a machine that is still

        in someone''s hands. Refusing with no way back would make a legitimately

        re-imaged laptop permanently unenrollable, and a control that produces

        support tickets is a control people stop using: the pressure would be to

        revoke less, which is exactly the state this started from.


        So the exception is deliberate, attributable and narrow: one device, one

        enrolment, expiring on its own within ``_REENROLLMENT_GRACE`` if nobody

        uses it, withdrawn by revoking again, and recorded either way.


        Gated on ``dlp.manage`` on TOP of the manage grant the rest of these routes

        use. Revoking a device and undoing that revocation are not symmetric: the

        ''developer'' role holds ``runtime_security.apps.manage`` and may revoke,

        because revoking can only ever take a machine''s credential away. Handing it

        back is the offboarding control itself.'
      operationId: allow_device_reenrollment_api_runtime_security_agent_devices__device_uuid__allow_reenrollment_post
      parameters:
      - name: device_uuid
        in: path
        required: true
        schema:
          type: string
          title: Device Uuid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/runtime-security/agent/rules:
    get:
      tags:
      - runtime-security-agent
      summary: List Device Rules
      description: What this device enforces, and what the person may change about it.
      operationId: list_device_rules_api_runtime_security_agent_rules_get
      parameters:
      - name: X-Blindsight-Device-Token
        in: header
        required: false
