  /api/runtime-security/discovery/activity:
    get:
      tags:
      - runtime-security-discovery
      summary: Discovery Activity
      description: 'Daily connections to AI services: this window against the one before it.


        Read from the per-day rollup, never from ``hit_count`` (a running total with

        no time dimension). Both series are the same length and gap-filled with

        zeros so the trend can be drawn like-for-like.


        ``collecting_since`` is the first day we have any rollup for. It is null on a

        workspace whose agents have not reported since the rollup shipped, which is

        the honest signal that there is nothing to chart yet rather than a flat zero

        line implying no AI traffic.'
      operationId: discovery_activity_api_runtime_security_discovery_activity_get
      parameters:
      - name: days
        in: query
        required: false
        schema:
          type: integer
          maximum: 365
          minimum: 2
          description: Length of the trend window in days
          default: 30
          title: Days
        description: Length of the trend window in days
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/runtime-security/discovery/catalog:
    get:
      tags:
      - runtime-security-discovery
      summary: Discovery Catalog
      description: 'The reference list of AI services the agents can detect: the inspected

        providers plus the observe catalog (what "shadow AI" coverage looks like).'
      operationId: discovery_catalog_api_runtime_security_discovery_catalog_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/runtime-security/discovery/{service_uuid}/protect:
    post:
      tags:
      - runtime-security-discovery
      summary: Protect Service
      description: 'Protect a discovered service without approving or banning it.


        Pushes a ``protect`` host rule: the agent inspects the traffic, PII is

        pseudonymized before the prompt leaves the device and injection is scored

        and logged, and the person using it is never blocked. ``status`` is left

        alone on purpose, protecting a service is not a decision about whether the

        company wants it, and the review queue should still show it.


        Refused on a service somebody has banned or adopted: see

        ``_refuse_if_decided``.'
      operationId: protect_service_api_runtime_security_discovery__service_uuid__protect_post
      parameters:
      - name: service_uuid
        in: path
        required: true
        schema:
          type: string
          title: Service Uuid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/runtime-security/discovery/{service_uuid}/unprotect:
    post:
      tags:
      - runtime-security-discovery
      summary: Unprotect Service
      description: 'Drop this service''s own rule, so it falls back to the workspace posture.


        With "protect unapproved AI" on, that floor is still ``protect``: the way

        to stop inspecting one host while the posture stays on is an explicit

        ``observe`` override, which is what this writes when the floor would

        otherwise re-protect it.


        Refused on a service somebody has banned or adopted: see

        ``_refuse_if_decided``.'
      operationId: unprotect_service_api_runtime_security_discovery__service_uuid__unprotect_post
      parameters:
      - name: service_uuid
        in: path
        required: true
        schema:
          type: string
          title: Service Uuid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/runtime-security/discovery/{service_uuid}/sanction:
    post:
      tags:
      - runtime-security-discovery
      summary: Sanction Service
      description: "Mark a discovered service as sanctioned (allowed, no longer shadow).\n\nSanctioning\
        \ is the decision that this is not shadow AI, so it also takes the\nservice out of whatever the\
        \ shadow-AI posture was doing to it:\n\n* a ``block`` rule is cleared, so approving a tool is\
        \ a real way back from\n  banning it rather than a status change the agent never hears about;\n\
        * the \"protect unapproved AI\" floor stops applying, because the setting says\n  *unapproved*\
        \ and this one now is. Written as an explicit ``observe`` rule,\n  since the floor would otherwise\
        \ re-protect it on the next merge.\n\nAn admin who wants an approved tool inspected can still\
        \ protect it by hand;\nthat is a decision about this service, not a side effect of a posture aimed\n\
        at the ones nobody vetted.\n\nBoth of those follow from the status alone, so the rule is written\
        \ by\n``_apply_decision`` rather than here. The version that reasoned about it\ninline treated\
        \ them as alternatives and never did the second after the\nfirst."
      operationId: sanction_service_api_runtime_security_discovery__service_uuid__sanction_post
      parameters:
      - name: service_uuid
        in: path
        required: true
        schema:
          type: string
          title: Service Uuid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/runtime-security/discovery/{service_uuid}/block:
    post:
      tags:
      - runtime-security-discovery
