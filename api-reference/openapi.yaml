    post:
      tags:
      - runtime-security-agent
      summary: Revoke Device
      operationId: revoke_device_api_runtime_security_agent_devices__device_uuid__revoke_post
      parameters:
      - name: device_uuid
        in: path
        required: true
        schema:
          type: string
          title: Device Uuid
      responses:
