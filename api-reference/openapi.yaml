  /api/runtime-security/agent/devices/{device_uuid}/resume:
    post:
      tags:
      - runtime-security-agent
      summary: Admin Resume Device
      description: 'Lift a pause from the console.


        Without this a pause could only be undone by the paused device''s own bound

        user, so it outlived the permission being revoked, the device being

        rebound, and the person leaving: protection stayed off with nobody able to

        turn it back on. An admin can always end it.'
      operationId: admin_resume_device_api_runtime_security_agent_devices__device_uuid__resume_post
      parameters:
      - name: device_uuid
