  /api/rag-corpus/{corpus_uuid}/filter-contract:
    get:
      tags:
      - rag-corpus
      summary: Get Filter Contract
      description: 'Retrieval-time filter contract the customer must enforce for quarantine.


        Quarantine only excludes a document from Blindsight''s *own* reads. A vector

        store that ignores metadata on unfiltered queries (Pinecone) still returns

        quarantined vectors to the customer''s application queries unless those

        queries carry the exclude filter. This returns, per write-capable

        vector-store source, the exact filter + a copy-paste retrieval snippet so the

        customer''s retrieval path actually enforces quarantine.'
      operationId: get_filter_contract_api_rag_corpus__corpus_uuid__filter_contract_get
      parameters:
      - name: corpus_uuid
        in: path
        required: true
        schema:
          type: string
