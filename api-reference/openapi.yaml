          pattern: ^(retrieval|tool_result|web|email|file|document|user_upload|other)$
          title: Source
          description: 'Where the span came from. Sets the default strictness: tool_result and web are
            strict (any assistant-directed instruction is a finding), the rest are balanced (the instruction
            must address the assistant, shape the reply, or carry an injection marker).'
          default: retrieval
        label:
          anyOf:
          - type: string
            maxLength: 128
          - type: 'null'
          title: Label
          description: Your own identifier for the span, echoed back on findings.
        strictness:
          anyOf:
          - type: string
            pattern: ^(strict|balanced)$
          - type: 'null'
          title: Strictness
          description: Override the strictness implied by `source`.
      type: object
      required:
      - content
      title: UntrustedSpan
      description: 'A part of the prompt that did NOT come from the user.


        Retrieved documents, tool results, scraped pages, email bodies. Marking them

        tells the firewall to treat their contents as DATA: inside an untrusted span

        an instruction aimed at the assistant is a finding no matter how ordinary it

        sounds, because the user never asked for it. "Summarize the 2020 climate

        report" is a normal request from a user and an attack from a document.'
