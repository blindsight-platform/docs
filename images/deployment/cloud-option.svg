<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Cloud option: your devices, your network, the Blindsight cloud</title>
  <desc id="d">The agent on each device inspects AI traffic locally and sends it on to AI services as before. It sends metadata to platform.blindsight.io and downloads signed updates from downloads.blindsight.io, both over HTTPS on TCP 443. Masked text reaches the cloud scanner only when prompt injection detection is on.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#111"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#71717a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="700" rx="16" fill="#ffffff"/>

  <!-- Tier 1: devices -->
  <rect x="20" y="20" width="290" height="540" rx="12" fill="#f4f4f5" stroke="#d4d4d8"/>
  <text x="40" y="50" font-size="15" font-weight="700" fill="#111">1. Your devices</text>
  <text x="40" y="69" font-size="12" fill="#52525b">Windows and macOS</text>

  <rect x="40" y="90" width="250" height="62" rx="8" fill="#fff" stroke="#111"/>
  <text x="56" y="116" font-size="13" font-weight="600" fill="#111">Browsers, AI apps, CLI tools</text>
  <text x="56" y="136" font-size="12" fill="#52525b">Used as normal by the person</text>
  <line x1="165" y1="152" x2="165" y2="184" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/>

  <rect x="40" y="188" width="250" height="232" rx="8" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="56" y="216" font-size="14" font-weight="700" fill="#111">Blindsight agent</text>
  <text x="56" y="240" font-size="12" fill="#3f3f46">Inspects AI traffic on the device</text>
  <text x="56" y="258" font-size="12" fill="#3f3f46">Finds, masks or counts personal</text>
  <text x="56" y="276" font-size="12" fill="#3f3f46">data before anything leaves</text>
  <text x="56" y="304" font-size="12" fill="#3f3f46">Listens on 127.0.0.1 only:</text>
  <text x="56" y="322" font-size="12" fill="#3f3f46">8787 and 47324 to 47327</text>
  <text x="56" y="350" font-size="12" fill="#3f3f46">Stand-in mapping is kept here,</text>
  <text x="56" y="368" font-size="12" fill="#3f3f46">encrypted, and never sent</text>

  <rect x="40" y="484" width="250" height="56" rx="8" fill="#fff" stroke="#111"/>
  <text x="56" y="508" font-size="13" font-weight="600" fill="#111">Console users</text>
  <text x="56" y="527" font-size="12" fill="#52525b">A browser. Local accounts or SSO</text>

  <!-- Tier 2: network -->
  <rect x="330" y="20" width="300" height="540" rx="12" fill="#f4f4f5" stroke="#d4d4d8"/>
  <text x="350" y="50" font-size="15" font-weight="700" fill="#111">2. Your network</text>
  <text x="350" y="69" font-size="12" fill="#52525b">Proxy, PAC or WPAD, firewall</text>
  <rect x="500" y="90" width="110" height="450" rx="8" fill="#fff" stroke="#111" stroke-dasharray="6 4"/>
  <text x="555" y="116" font-size="12" font-weight="700" fill="#111" text-anchor="middle">Proxy</text>
  <text x="555" y="132" font-size="11" fill="#52525b" text-anchor="middle">(optional)</text>
  <text x="555" y="150" font-size="12" font-weight="700" fill="#111" text-anchor="middle">and firewall</text>
  <text x="555" y="520" font-size="11" fill="#52525b" text-anchor="middle">TCP 443 out</text>

  <!-- Tier 3: AI services and Blindsight cloud -->
  <rect x="650" y="170" width="330" height="96" rx="12" fill="#ffffff" stroke="#a1a1aa" stroke-dasharray="5 4"/>
  <text x="670" y="198" font-size="15" font-weight="700" fill="#111">AI services</text>
  <text x="670" y="218" font-size="12" fill="#52525b">On the internet, as today</text>

  <rect x="650" y="286" width="330" height="274" rx="12" fill="#f4f4f5" stroke="#d4d4d8"/>
  <text x="670" y="312" font-size="15" font-weight="700" fill="#111">3. Blindsight cloud</text>
  <text x="670" y="330" font-size="12" fill="#52525b">AWS eu-west-1 (Ireland)</text>

  <rect x="670" y="344" width="290" height="104" rx="8" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="686" y="368" font-size="14" font-weight="700" fill="#111">platform.blindsight.io</text>
  <text x="686" y="390" font-size="12" fill="#3f3f46">Console, API, policy with the AI</text>
  <text x="686" y="407" font-size="12" fill="#3f3f46">service catalogue, cloud scanner</text>
  <text x="686" y="430" font-size="11" fill="#52525b">Encrypted database and backups</text>

  <rect x="670" y="462" width="290" height="84" rx="8" fill="#fff" stroke="#111"/>
  <text x="686" y="486" font-size="14" font-weight="700" fill="#111">downloads.blindsight.io</text>
  <text x="686" y="507" font-size="12" fill="#3f3f46">Signed updates, names model</text>
  <text x="686" y="528" font-size="11" fill="#52525b">CDN. No customer data.</text>

  <!-- Flow 1: AI traffic -->
  <line x1="290" y1="226" x2="644" y2="226" stroke="#71717a" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#g)"/>
  <circle cx="400" cy="226" r="11" fill="#fff" stroke="#71717a" stroke-width="1.5"/>
  <text x="400" y="230.5" font-size="12" font-weight="700" fill="#3f3f46" text-anchor="middle">1</text>

  <!-- Flow 2: agent to platform -->
  <line x1="290" y1="362" x2="664" y2="362" stroke="#111" stroke-width="2" marker-end="url(#a)"/>
  <circle cx="400" cy="362" r="11" fill="#111"/>
  <text x="400" y="366.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">2</text>

  <!-- Flow 3: agent to downloads -->
  <path d="M290,408 H460 V500 H664" fill="none" stroke="#111" stroke-width="2" marker-end="url(#a)"/>
  <circle cx="400" cy="408" r="11" fill="#111"/>
  <text x="400" y="412.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">3</text>

  <!-- Flow 4: console users to platform -->
  <path d="M290,512 H440 V550 H640 V430 H664" fill="none" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/>
  <circle cx="370" cy="512" r="11" fill="#111"/>
  <text x="370" y="516.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">4</text>

  <!-- Legend -->
  <rect x="20" y="580" width="960" height="104" rx="12" fill="#fff" stroke="#d4d4d8"/>
  <text x="40" y="604" font-size="12" font-weight="700" fill="#111">All flows are HTTPS on TCP 443.</text>
  <circle cx="48" cy="624" r="8" fill="#fff" stroke="#71717a"/>
  <text x="48" y="628" font-size="10" font-weight="700" fill="#3f3f46" text-anchor="middle">1</text>
  <text x="64" y="628" font-size="12" fill="#3f3f46">Inspected AI traffic leaves as it did before: direct, or through your proxy, PAC or WPAD. Windows and macOS.</text>
  <circle cx="48" cy="646" r="8" fill="#111"/>
  <text x="48" y="650" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">2</text>
  <text x="64" y="650" font-size="12" fill="#3f3f46">Enrolment, policy, heartbeat and events: metadata only. Masked text only with prompt injection detection on. Follows your proxy (macOS from 2.2.2).</text>
  <circle cx="48" cy="668" r="8" fill="#111"/>
  <text x="48" y="672" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">3</text>
  <text x="64" y="672" font-size="12" fill="#3f3f46">Signed updates and the names model.</text>
  <circle cx="358" cy="668" r="8" fill="#111"/>
  <text x="358" y="672" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">4</text>
  <text x="374" y="672" font-size="12" fill="#3f3f46">Console users reach the console.</text>
</svg>
